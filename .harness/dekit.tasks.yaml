tasks:
  claw/main:
    autostart: true
    cmd:
      - sh
      - -c
      - |
        # The gateway must be down while deploy configures it, and stays down
        # when this task stops: the container restarts on its own otherwise.
        bin/claw compose stop claw >/dev/null 2>&1
        trap 'bin/claw compose stop claw; exit 0' TERM INT
        CLAW_BUILD=auto bin/claw deploy || exit 1
        bin/claw compose up claw & wait $!
    label: OpenClaw gateway with the wtc plugin
    ready:
      timeout: 360s
    x-wtc:
      port_env: WTC_CLAW_PORT
